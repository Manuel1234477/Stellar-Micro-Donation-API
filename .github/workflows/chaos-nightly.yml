name: Chaos Engineering Nightly Suite

# ─── Triggers ──────────────────────────────────────────────────────────────────
# Runs automatically every night at 3 AM UTC.
# workflow_dispatch allows maintainers to trigger a run manually from GitHub Actions UI.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# ─── Permissions ───────────────────────────────────────────────────────────────
permissions:
  contents: read
  issues: write

# ─── Jobs ──────────────────────────────────────────────────────────────────────
jobs:
  chaos-tests:
    name: Chaos Engineering Scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Chaos Test Suite
        run: npm test -- tests/chaos --runInBand --forceExit
        env:
          NODE_ENV: test
          MOCK_STELLAR: 'true'

      # ─── Failure Notification: Automatically create annotated GitHub issue ───
      - name: Create Issue on Chaos Failure
        if: failure()
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.sha;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `🚨 Chaos Engineering Nightly Run Failed (${new Date().toISOString().split('T')[0]})`;
            const body = [
              '## 🌪️ Chaos Engineering Suite Failure Report',
              '',
              `The automated nightly chaos test suite failed on commit \`${sha.slice(0, 7)}\`.`,
              '',
              `**Workflow Run:** [View Logs](${runUrl})`,
              '',
              '### Potential Root Causes:',
              '- Database connection drop or lock handling regression',
              '- Horizon timeout / malformed response handling failure',
              '- Race condition or state inconsistency under concurrency',
              '- Process signal or teardown exception during in-flight transactions',
              '',
              '### Action Items:',
              '1. Review the workflow failure logs to pinpoint the failing chaos scenario.',
              '2. Verify database rollback and circuit breaker invariants.',
              '3. Implement necessary fault-tolerance fixes.',
            ].join('\n');

            // Search for an existing open issue with the same title prefix
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['chaos-engineering'],
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['chaos-engineering', 'bug', 'automated-report'],
              });
            } else {
              // Add a comment to the existing open issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `**Recurring Failure:** Nightly chaos test failed again on commit \`${sha.slice(0, 7)}\`.\n[View Run Details](${runUrl})`,
              });
            }
