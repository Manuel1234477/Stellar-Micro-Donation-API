name: Migration Down() Check

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'src/migrations/**'
      - 'scripts/check-migration-down.js'
      - '.github/workflows/migration-down-check.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'src/migrations/**'
      - 'scripts/check-migration-down.js'
      - '.github/workflows/migration-down-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-down-functions:
    runs-on: ubuntu-latest
    name: Verify All Migrations Export down()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check migrations export down()
        run: node scripts/check-migration-down.js
