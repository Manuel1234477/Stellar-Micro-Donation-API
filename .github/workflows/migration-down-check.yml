name: Migration Down() Check

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'src/migrations/**'
      - 'scripts/check-migration-down.js'
      - '.github/workflows/migration-down-check.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'src/migrations/**'
      - 'scripts/check-migration-down.js'
      - '.github/workflows/migration-down-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-down-functions:
    runs-on: ubuntu-latest
    name: Verify All Migrations Export down()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check migrations export down()
        run: node scripts/check-migration-down.js
