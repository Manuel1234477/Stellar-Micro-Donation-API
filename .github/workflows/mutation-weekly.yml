name: Mutation Testing (weekly)

# Weekly Stryker run on the critical money, validation, state-machine, and auth
# modules listed in stryker.conf.json. Enforces its 60% break threshold and
# publishes the report artifact. See docs/testing/mutation-testing-guide.md.

on:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Stryker is installed for this job only so it does not become a project
      # dependency. Keep the two packages on the same version.
      - run: npm install --no-save @stryker-mutator/core@9.6.1 @stryker-mutator/jest-runner@9.6.1
      - run: npm run mutation:test
        env:
          NODE_ENV: test
          MOCK_STELLAR: 'true'
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
          if-no-files-found: warn
