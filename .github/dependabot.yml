version: 2
updates:
  # ────────────────────────────────────────────────────────────────────────────
  # npm packages
  # ────────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"

    groups:
      # Security patches (highest priority) — applies to ALL security updates
      # regardless of whether the package is prod or dev.
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"

      # Production dependencies — minor and patch bumps only.
      # Major version updates will still be opened as individual PRs so
      # breaking-change review is not skipped.
      production-deps:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
        exclude-patterns:
          # Exclude dev-only scopes from this group
          - "@types/*"

      # Dev / tooling dependencies — all minor and patch updates grouped.
      dev-deps:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  # ────────────────────────────────────────────────────────────────────────────
  # GitHub Actions
  # ────────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps-actions)"
      include: "scope"
    groups:
      actions-updates:
        patterns:
          - "*"
