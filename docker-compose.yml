services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    # Copy .env.example to .env and configure production secrets before starting.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DB_PATH: /data/stellar_donations.db
    volumes:
      - db_data:/data
    tmpfs:
      - /tmp
    read_only: true
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health/ready']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  db_data: